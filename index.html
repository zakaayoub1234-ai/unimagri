<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>  UNIMAGRI</h1>
        <div class="cart-info">
            🛒 السلة: <span id="cart-count">0</span> قطعة
        </div>
    </header>

    <div class="container">
        <main class="products-grid" id="products-list"></main>

        <aside class="cart-sidebar">
            <h2>🛒 سلتك</h2>
            <div id="cart-items">
                <p class="empty-msg">السلة فارغة حالياً</p>
            </div>
            <div class="total-section">
                <span>الإجمالي:</span>
                <span id="total-price">0</span> ريال
            </div>
            <button class="checkout-btn" onclick="checkout()">إتمام الطلب</button>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
